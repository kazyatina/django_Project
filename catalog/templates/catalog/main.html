{%extends 'catalog/base.html'%}
{% load static %}
{%load my_tags%}
{%block content%}
<div class="container">
    <div class="row mb-2">
        {%for pro in products%}
        <div class="col-md-6">
            <div class="row g-0 border rounded overflow-hidden flex-md-row mb-4 shadow-sm h-md-250 position-relative">
                <div class="col p-4 d-flex flex-column position-static">
                    <h3 class="mb-0">{{pro.name}}</h3>
                    <ul class="list-unstyled mt-3 mb-4">
                        <li>Описание: {{pro.description|truncatechars:100}}</li>
                        <li>Категория: {{pro.category}}</li>
                        <h3 class="mb-0">{{pro.price}} руб.</h3>
                    </ul>
                    <a href="{% url 'catalog:product_detail' pro.pk %}" class="icon-link gap-1 icon-link-hover stretched-link">
                        Купить
                        <svg class="bi" aria-hidden="true">
                            <use xlink:href="{% url 'catalog:product_detail' pro.pk %}"></use>
                        </svg>
                    </a>
                </div>
                <div class="col-auto d-none d-lg-block">
                    <img src="{{ pro.image| media_filter }}" class="img-thumbnail" alt="{{ product.name }}">
<!--                    <img src="{{ pro.image.url | media_filter }}" class="img-thumbnail" alt="{{ pro.name }}">  -->
<!--                    не работает-->
                </div>
            </div>
        </div>
        {%endfor%}
    </div>
</div>
{%endblock%}
