{%extends 'catalog/base.html'%}
{% load static %}
{%load my_tags%}
{% block title %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h3>Информация о продукте</h3>
</div>
{% endblock %}
{%block content%}
<div class="container py-3">
    <div class="row row-cols-1 row-cols-md-3 mb-3 text-center">
        <div class="col mb-3">
            <div class="card mb-4 rounded-3 shadow-sm">
                <div class="card-header py-3"><h4 class="my-0 fw-normal">{{object.name}}</h4></div>
                <div class="card mb-4 rounded-3 shadow-sm">
                    <img src="{{object.image.url}}" class="img-thumbnail" alt="{{ object.name }}">
                </div>
                <div class="card-body"><h1 class="card-title pricing-card-title">{{object.price}} руб.</h1>
                    <ul class="list-unstyled mt-3 mb-4">
                        <li>Описание: {{object.description|truncatechars:100}}</li>
                        <li>Категория: {{object.category}}</li>
                    </ul>
                    <a href="{% url 'catalog:product_list' %}" class="btn btn-success">
                        Купить

                    </a>
                    <a href="{% url 'catalog:product_list' %}" class="icon-link gap-1 icon-link-hover stretched-link">
                        Назад
                        <svg class="bi" aria-hidden="true">
                            <use xlink:href="{% url 'catalog:product_list' %}"></use>
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{%endblock%}
